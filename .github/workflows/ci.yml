name: CareerCanvas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: careercanvas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -r requirements-lock.txt

      - name: Validate documentation links
        run: .venv/bin/python scripts/check_markdown_links.py

      - name: Install Chromium for Python Playwright
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright tests
        working-directory: frontend
        run: npx playwright install chromium

      - name: Backend tests
        run: .venv/bin/python -m pytest -q

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Playwright end-to-end tests
        working-directory: frontend
        env:
          CAREERCANVAS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm run test:e2e
